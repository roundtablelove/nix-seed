# build each example from its seed (pull + mount + offline nix build)
name: build-examples

on:
  push:
    branches:
      - master
    # ignore the paths seed-examples watches: a seed-affecting change goes
    # push -> seed-examples -> workflow_run -> build-examples, so build never
    # races ahead of its seed. (.seed.lock included, not negated: the cycle's
    # `chore(seed): lock` commit is already build-tested by the workflow_run
    # this list exists to defer to, so building it again on push would only
    # duplicate that run.) consumer-side changes (bin/mount-seed,
    # action.yaml) cannot change a seed's contents, so they still build
    # directly on push.
    #
    # this list must mirror seed-examples' trigger paths, or a change to
    # one of them fires a direct build *and* a workflow_run build.
    paths-ignore:
      - flake.lock
      - examples/**
      - mkseed/**
      - flake.nix
      - seed/**
      - bin/build-seed
      - bin/write-seed-lock
      - bin/make-dmg
      - .github/workflows/seed-examples.yaml
  workflow_run:
    workflows:
      - seed-examples
    types:
      - completed
  workflow_dispatch:

jobs:
  setup:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # actions:read: resolving the triggering run's real head_sha below
    # reads it back via the Actions API.
    permissions:
      contents: read
      actions: read
    outputs:
      examples: ${{ steps.list.outputs.examples }}
      ref: ${{ steps.ref.outputs.sha }}
    steps:
      # the commit the triggering cycle sealed: seed/lock publishes the
      # sha of its one `chore(seed): lock` commit as an artifact, and
      # that commit's locks name the seeds that cycle just built. this
      # is the point of the chain -- to build-test those, rather than
      # whatever the previous cycle left behind.
      #
      # no other channel carries it. job outputs are not exposed by the
      # REST API, a plain checkout takes the branch tip (which drifts),
      # and both github.sha and the run's recorded head_sha name the
      # commit that *triggered* seeding -- the lock commit's parent.
      - name: fetch the lock commit
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: seed-lock-commit
          path: ${{ runner.temp }}/lock
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve the commit to build
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -f "$RUNNER_TEMP/lock/lock-commit" ]]; then
            sha=$(<"$RUNNER_TEMP/lock/lock-commit")
          elif [[ ${{ github.event_name }} == workflow_run ]]; then
            # a cycle that published nothing has no lock commit: a
            # --no-push timing dispatch. build whatever master's locks
            # say today, which is what this did before the artifact
            # existed. (a cycle with a *failed* leg never reaches here
            # -- the job-level `if` above gates on its conclusion.)
            echo "::notice::no seed-lock-commit artifact; building the current locks"
            sha=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}" --jq .head_sha)
          else
            sha=${{ github.sha }}
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.sha }}
      - id: list
        uses: ./.github/actions/list-examples

  build:
    needs: setup
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      # one platform failing should not hide the others' results
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.setup.outputs.examples) }}
        os:
          # - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15
          # - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      # pinned to the same commit setup resolved above, not re-resolved
      # here: see its comment for why a plain checkout, or even
      # github.event.workflow_run.head_sha, is not good enough. named
      # after that sha, not just "checkout": this run's own head_sha (as
      # the Actions API reports it) has the same drift for a
      # workflow_run trigger, so bench-workflows reads the real one back
      # from this step's name via the (much cheaper) jobs API, rather
      # than needing this job's full log.
      #
      # the lock commit is a descendant of whatever else landed on
      # master while the cycle ran, so its *tree* can hold sources newer
      # than the seed its digests name. that push triggers its own
      # cycle and the next lock commit heals it -- but an intermediate
      # run here can go red without anyone having broken anything.
      - name: checkout ${{ needs.setup.outputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: ./
        with:
          path: examples/${{ matrix.example }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # an ordinary nix build, run by the consumer. no sudo and no
      # namespace: the baked nix.conf has no substituters, so the build
      # reaches nothing but the mounted closure. `unshare --net` here
      # would turn that from configured into enforced.
      - name: build
        run: nix build ./examples/${{ matrix.example }} --print-out-paths

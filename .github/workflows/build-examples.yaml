# build each example from its seed (pull + mount + offline nix build)
name: build-examples

on:
  push:
    branches:
      - master
    # ignore the paths seed-examples watches: a seed-affecting change goes
    # push -> seed-examples -> workflow_run -> build-examples, so build never
    # races ahead of its seed. (.seed.lock included, not negated: the per-arch
    # `chore(seed): lock` commits must NOT trigger a build on a half-written
    # lock -- the post-seed workflow_run covers them.) consumer-side
    # changes (bin/mount-seed, action.yaml) cannot change a seed's
    # contents, so they still build directly on push.
    paths-ignore:
      - flake.lock
      - examples/**
      - mkseed/**
      - flake.nix
      - seed/action.yaml
      - bin/build-seed
      - bin/make-dmg
      - .github/workflows/seed-examples.yaml
  workflow_run:
    workflows:
      - seed-examples
    types:
      - completed
  workflow_dispatch:

jobs:
  setup:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # actions:read: resolving the triggering run's real head_sha below
    # reads it back via the Actions API.
    permissions:
      contents: read
      actions: read
    outputs:
      examples: ${{ steps.list.outputs.examples }}
      ref: ${{ steps.ref.outputs.sha }}
    steps:
      # on a workflow_run trigger the commit that started seeding is the
      # one commit that can never carry the result: build-seed writes each
      # system's digest as a `chore(seed): lock` commit ON TOP of it, so
      # the triggering tree holds only the lock as it stood *before* the
      # seeding this run is here to test. pinning to it (whether via
      # github.sha, github.event.workflow_run.head_sha, or the run's
      # recorded head_sha read back from the API) therefore does not
      # remove drift, it guarantees it: the build silently mounts the
      # previous seed, and fails outright for any system whose entry the
      # older lock was missing. the branch tip is the only tree where the
      # lock is complete, so resolve that. seed-examples serialises on a
      # concurrency group, so no second seeding is mid-write here.
      # resolved once, in this job, so every matrix job pins the same
      # commit. github.sha on every other trigger (push,
      # workflow_dispatch) already is the right commit.
      - name: resolve the commit to build
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # through the environment, not interpolated into the script: a
          # branch name is attacker-shaped text on a workflow_run trigger.
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ ${{ github.event_name }} == workflow_run ]]; then
            sha=$(gh api --jq .sha \
              "repos/${{ github.repository }}/commits/$BRANCH")
          else
            sha=${{ github.sha }}
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.sha }}
      - id: list
        uses: ./.github/actions/list-examples

  build:
    needs: setup
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      # one platform failing should not hide the others' results
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.setup.outputs.examples) }}
        os:
          # - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15
          # - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      # pinned to the same commit setup resolved above, not re-resolved
      # here: a plain checkout per job would let the matrix straddle two
      # trees if anything lands on the branch mid-run. named
      # after that sha, not just "checkout": this run's own head_sha (as
      # the Actions API reports it) has the same drift for a
      # workflow_run trigger, so bench-workflows reads the real one back
      # from this step's name via the (much cheaper) jobs API, rather
      # than needing this job's full log.
      - name: checkout ${{ needs.setup.outputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: ./
        with:
          path: examples/${{ matrix.example }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # an ordinary nix build, run by the consumer. no sudo and no
      # namespace: the baked nix.conf has no substituters, so the build
      # reaches nothing but the mounted closure. `unshare --net` here
      # would turn that from configured into enforced.
      - name: build
        run: nix build ./examples/${{ matrix.example }} --print-out-paths

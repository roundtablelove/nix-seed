# build each example from its seed (pull + mount + offline nix build)
name: build-examples

on:
  push:
    branches:
      - master
    # ignore the paths seed-examples watches: a seed-affecting change goes
    # push -> seed-examples -> workflow_run -> build-examples, so build never
    # races ahead of its seed. (.seed.lock included, not negated: the per-arch
    # `chore(seed): lock` commits must NOT trigger a build on a half-written
    # lock -- the post-seed workflow_run covers them.) consumer-side
    # changes (bin/mount-seed, action.yaml) cannot change a seed's
    # contents, so they still build directly on push.
    paths-ignore:
      - flake.lock
      - examples/**
      - mkseed/**
      - flake.nix
      - seed/action.yaml
      - bin/build-seed
      - bin/make-dmg
      - .github/workflows/seed-examples.yaml
  workflow_run:
    workflows:
      - seed-examples
    types:
      - completed
  workflow_dispatch:

jobs:
  setup:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # actions:read: resolving the triggering run's real head_sha below
    # reads it back via the Actions API.
    permissions:
      contents: read
      actions: read
    outputs:
      examples: ${{ steps.list.outputs.examples }}
      ref: ${{ steps.ref.outputs.sha }}
    steps:
      # a plain checkout on a workflow_run event takes whatever is
      # currently at the default branch's tip, which by the time this
      # fires is routinely a few `chore(seed): lock` commits ahead of the
      # change that triggered seeding (seed-examples pushes one per
      # architecture as it runs). github.event.workflow_run.head_sha does
      # NOT fix this -- confirmed empirically, it carries the same drift
      # (it tracked a trailing lock commit even for a plain push trigger).
      # what does stay correct is the run's own recorded head_sha via the
      # API, so ask for that instead. github.sha on every other trigger
      # (push, workflow_dispatch) already is the right commit.
      - name: resolve the triggering commit
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ${{ github.event_name }} == workflow_run ]]; then
            sha=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}" --jq .head_sha)
          else
            sha=${{ github.sha }}
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.sha }}
      - id: list
        uses: ./.github/actions/list-examples

  build:
    needs: setup
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      # one platform failing should not hide the others' results
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.setup.outputs.examples) }}
        os:
          # - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15
          # - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      # pinned to the same commit setup resolved above, not re-resolved
      # here: see its comment for why a plain checkout, or even
      # github.event.workflow_run.head_sha, is not good enough.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: ./
        with:
          path: examples/${{ matrix.example }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # an ordinary nix build, run by the consumer. no sudo and no
      # namespace: the baked nix.conf has no substituters, so the build
      # reaches nothing but the mounted closure. `unshare --net` here
      # would turn that from configured into enforced.
      - name: build
        run: nix build ./examples/${{ matrix.example }} --print-out-paths

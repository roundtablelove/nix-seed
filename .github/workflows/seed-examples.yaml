name: seed-examples

on:
  push:
    branches:
      - master
    paths:
      # any build-affecting change under an example (flake.nix, sources,
      # flake.lock) must re-seed; exclude .seed.lock so the seeder's own
      # `chore(seed): lock` commits don't retrigger this workflow.
      - examples/**
      - '!examples/**/.seed*.lock'
      # what the seed is made of, and what makes it: mkseed builds the
      # squashfs, flake.nix wires `lib.mkSeed = import ./mkseed`, and the
      # seed action + build-seed decide what gets pushed and locked. a
      # change here leaves every published seed stale while the build
      # workflows keep consuming it, so re-seed. consumer-side code
      # (bin/mount-seed, action.yaml) is deliberately absent:
      # it cannot change a seed's contents, and builds test it on push.
      - mkseed/**
      - flake.nix
      - seed/action.yaml
      - bin/build-seed
      # assembles the darwin image, so it decides that artefact's bytes
      - bin/make-dmg
      - .github/workflows/seed-examples.yaml
  workflow_dispatch:

# two seedings must never overlap. each pushes a `chore(seed): lock`
# commit per system, and the tag those record is self.rev, so runs
# started at different commits write entries under different tags and
# interleave them into one lock. cancel-in-progress is false, not true:
# an in-flight run has already pushed some of its seeds to the registry,
# and killing it strands them unrecorded.
concurrency:
  group: seed-examples
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        uses: ./.github/actions/list-examples

  seed:
    needs: setup
    permissions:
      contents: write
      id-token: write
      packages: write
    strategy:
      # one example or platform failing should not cancel seeding the others
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.setup.outputs.examples) }}
        os:
          # - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15
          # - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./seed
        with:
          path: examples/${{ matrix.example }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

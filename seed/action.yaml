name: Nix Seed
description: Build the Nix Seed and push it to the registry

inputs:

  path:
    description: Path to flake.nix
    default: .

  seed_attr:
    description: Flake package attribute of the Seed
    default: seed

  nix_conf:
    description: Extra nix.conf entries

  registry:
    description: Container registry (default ghcr.io)
    default: ghcr.io
  github_token:
    description: GitHub Token for registry login
  push:
    description: >-
      Push the seed and commit its lock. Set false to build and package
      only, for timing runs: repeated pushes of a multi-GB seed trip the
      registry's secondary rate limit.
    default: "true"

  cachix_name:
    description: Cachix cache name
    default: ${{ github.event.repository.name }}
  cachix_auth_token:
    description: Cachix auth token
  cachix_signing_key:
    description: Cachix signing key

runs:
  using: composite
  steps:

    - name: Nix Setup
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          ${{ inputs.nix_conf }}

    - name: Cachix Setup
      if: ${{ inputs.cachix_auth_token != '' }}
      uses: cachix/cachix-action@v17
      with:
        name: ${{ inputs.cachix_name }}
        authToken: ${{ inputs.cachix_auth_token }}
        signingKey: ${{ inputs.cachix_signing_key }}

    - name: Build seed
      id: seed
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_PASS: ${{ inputs.github_token }}
      run: |-
        set -x
        "$GITHUB_ACTION_PATH"/../bin/build-seed \
          --seed-attr ${{ inputs.seed_attr }} \
          --registry ${{ inputs.registry }} \
          ${{ inputs.push == 'false' && '--no-push' || '' }} \
          ${{ inputs.path }}

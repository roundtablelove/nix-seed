name: Nix Seed
description: Build the Nix Seed and push it to the registry

inputs:

  path:
    description: Path to flake.nix
    default: .

  seed_attr:
    description: Flake package attribute of the Seed
    default: seed

  nix_conf:
    description: Extra nix.conf entries

  registry:
    description: Container registry (default ghcr.io)
    default: ghcr.io
  github_token:
    description: GitHub Token for registry login
  push:
    description: >-
      Push the seed and record its digest. Set false to build and
      package only, for timing runs: repeated pushes of a multi-GB seed
      trip the registry's secondary rate limit.
    default: "true"

  cachix_name:
    description: Cachix cache name
    default: ${{ github.event.repository.name }}
  cachix_auth_token:
    description: Cachix auth token
  cachix_signing_key:
    description: Cachix signing key

runs:
  using: composite
  steps:

    - name: Nix Setup
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          ${{ inputs.nix_conf }}

    - name: Cachix Setup
      if: ${{ inputs.cachix_auth_token != '' }}
      uses: cachix/cachix-action@v17
      with:
        name: ${{ inputs.cachix_name }}
        authToken: ${{ inputs.cachix_auth_token }}
        signingKey: ${{ inputs.cachix_signing_key }}

    - name: Build seed
      id: seed
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_PASS: ${{ inputs.github_token }}
      run: |-
        set -x
        "$GITHUB_ACTION_PATH"/../bin/build-seed \
          --seed-attr ${{ inputs.seed_attr }} \
          --registry ${{ inputs.registry }} \
          ${{ inputs.push == 'false' && '--no-push' || format('--record {0}/seed-digest.json', runner.temp) }} \
          ${{ inputs.path }}

    # the digest leaves this leg as an artifact rather than as a commit:
    # one leg only ever knows its own system, so a lock written here
    # could only ever name one. seed/lock collects a whole cycle's
    # records and commits them together. see bin/write-seed-lock.
    - name: Record digest
      id: record
      if: ${{ inputs.push != 'false' }}
      shell: bash
      run: |
        # artifact names reject "/", and a flake path can contain one
        # (list-examples emits e.g. "hello/innocent"), so slugify. the
        # name is only a uniqueness key -- write-seed-lock groups by the
        # path inside the file, and rejects a duplicated system -- so a
        # slug collision cannot silently merge two flakes' digests.
        slug=$(jq -r '"\(.path)-\(.system)"' "$RUNNER_TEMP/seed-digest.json" |
          tr '/.' '--')
        echo "name=seed-digest-$slug" >>"$GITHUB_OUTPUT"

    - name: Upload digest
      if: ${{ inputs.push != 'false' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.record.outputs.name }}
        path: ${{ runner.temp }}/seed-digest.json
        retention-days: 1
        # "re-run failed jobs" re-runs the failed legs into the SAME
        # run, where the successful legs' artifacts already exist and
        # are immutable. without this the re-run fails on the upload
        # rather than on anything real -- and re-running is exactly
        # what a cycle discarded by one flaky leg asks for.
        overwrite: true

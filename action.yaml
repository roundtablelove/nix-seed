name: Nix Seed
description: >-
  Mount a Nix Seed as /nix/store and put the seeded nix on PATH. Setup
  only: run your own `nix build` in a later step.

inputs:

  path:
    description: Path to flake.nix
    default: .

  seed_attr:
    description: Flake package attribute of the seed to consume
    default: seed

  github_token:
    description: GitHub Token

runs:
  using: composite
  steps:

    # the lock names the registry image and this system's digest; the
    # blob is pulled straight from the registry (four parallel range
    # requests, see bin/mount-seed) and verified against that digest.
    # a lock is written whole-cycle by bin/write-seed-lock -- every
    # system its cycle built, at one tag, in one commit -- so a lock
    # that names no seed for this system was never seeded for it.
    - name: seed digest
      id: seed
      shell: bash
      run: |
        system=$(uname -m | sed s/arm64/aarch64/)-$(uname -s | tr '[:upper:]' '[:lower:]')
        # lock file for this seed attribute: "seed" -> .seed.lock, dots
        # becoming dashes (mirrors bin/build-seed)
        suffix=${{ inputs.seed_attr }}
        lock=${{ inputs.path }}/.${suffix//./-}.lock

        # a bare `jq -er` here exits 1 with nothing on stdout or stderr,
        # which in the log looks like the step simply died. say which
        # file, which system, and what the lock does offer instead.
        [[ -f $lock ]] || {
          echo "::error::No seed lock at $lock. Nothing has published a" \
            "seed for ${{ inputs.path }} yet -- run the seed-examples" \
            "workflow first, or bin/build-seed followed by" \
            "bin/write-seed-lock to publish and record one by hand."
          exit 1
        }
        # the format gate DESIGN.md#building-from-seed asks for: a lock
        # this action cannot read is a hard stop, never a silent guess.
        version=$(jq -r '.version // 0' "$lock")
        [[ $version == 1 ]] || {
          echo "::error::$lock is seed lock format version $version;" \
            "this action understands version 1. Upgrade the nix-seed" \
            "action, or re-seed ${{ inputs.path }} to rewrite the lock."
          exit 1
        }

        if ! digest=$(jq -er --arg s "$system" '.systems[$s]' "$lock"); then
          have=$(jq -r '.systems | keys | join(", ") | if . == "" then
            "(none)" else . end' "$lock")
          tag=$(jq -r '.tag // "(none)"' "$lock")
          echo "::error::$lock has no seed for $system. It records: $have" \
            "(at tag $tag). A cycle locks every system it built at once," \
            "so this system is not in the seed matrix for" \
            "${{ inputs.path }} -- add it there and re-seed."
          exit 1
        fi
        echo "lock=$lock" >>"$GITHUB_OUTPUT"
        echo "digest=$digest" >>"$GITHUB_OUTPUT"

    - name: mount seed
      shell: bash
      env:
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_PASS: ${{ inputs.github_token }}
      run: |-
        "$GITHUB_ACTION_PATH"/bin/mount-seed ${{ inputs.path }} \
          "$RUNNER_TEMP/seed" \
          "${{ steps.seed.outputs.digest }}" \
          "${{ steps.seed.outputs.lock }}"
